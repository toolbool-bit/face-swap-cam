<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face Swap Cam</title>
<style>
body{margin:0;background:#111;color:#eee;font:14px system-ui;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
canvas{max-width:100%;border-radius:12px;background:#000}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button,label.b{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
button.on{background:#5b8cff;border-color:#5b8cff}
video{display:none}
</style></head><body>
<h3 id="st">Loading models…</h3>
<video id="v" playsinline muted></video>
<canvas id="c" width="960" height="720"></canvas>
<div class="row">
  <label class="b">📁 Upload face<input id="f" type="file" accept="image/*" hidden></label>
  <button data-m="swap">Face swap</button>
  <button data-m="off">Off</button>
  <button id="snap">📸 Save</button>
</div>
<div class="row" id="em"></div>

<script type="module">
import {FaceLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import Delaunator from "https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm";

const $=id=>document.getElementById(id);
const v=$('v'),c=$('c'),x=c.getContext('2d');
const MODEL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
let mode='swap',emoji=null,src=null,tris=null,res=null,last=-1;

// UI
const EMOJIS=['🤡','👽','🐶','🐱','🤖','💀','👹','🦊','🐸','🎃','😎','🦄'];
EMOJIS.forEach(e=>{const b=document.createElement('button');b.textContent=e;b.onclick=()=>{mode='emoji';emoji=e;ui()};$('em').append(b)});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;ui()});
function ui(){
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  document.querySelectorAll('#em button').forEach(b=>b.classList.toggle('on',mode==='emoji'&&b.textContent===emoji));
  $('st').textContent=mode==='swap'&&!src?'Upload a face photo (front-facing works best)':'Ready';
}
$('snap').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='face.png';a.click()});

try{
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const mk=async run=>{
    const o=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:run,numFaces:1});
    try{return await FaceLandmarker.createFromOptions(fs,o("GPU"))}
    catch{return await FaceLandmarker.createFromOptions(fs,o("CPU"))}
  };
  const [lmV,lmI]=await Promise.all([mk("VIDEO"),mk("IMAGE")]);

  v.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:960,height:720,facingMode:'user'},audio:false});
  await v.play();
  c.width=v.videoWidth;c.height=v.videoHeight;
  ui();

  // Upload source face
  $('f').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    const img=new Image();img.src=URL.createObjectURL(file);await img.decode();
    const r=lmI.detect(img);
    if(!r.faceLandmarks.length){alert('No face found in that image. Try a clearer, front-facing photo.');return}
    const p=r.faceLandmarks[0].map(q=>[q.x*img.naturalWidth,q.y*img.naturalHeight]);
    tris=Delaunator.from(p).triangles;src={img,p};mode='swap';ui();
  };

  function tri(img,s,d){
    const [s0,s1,s2]=s,[d0,d1,d2]=d;
    const cx=(d0[0]+d1[0]+d2[0])/3,cy=(d0[1]+d1[1]+d2[1])/3;
    const ex=q=>{const dx=q[0]-cx,dy=q[1]-cy,l=Math.hypot(dx,dy)||1;return[q[0]+dx/l*.7,q[1]+dy/l*.7]};
    const [e0,e1,e2]=d.map(ex);
    const det=(s1[0]-s0[0])*(s2[1]-s0[1])-(s2[0]-s0[0])*(s1[1]-s0[1]);
    if(Math.abs(det)<1e-6)return;
    const a=((d1[0]-d0[0])*(s2[1]-s0[1])-(d2[0]-d0[0])*(s1[1]-s0[1]))/det;
    const cc=((d2[0]-d0[0])*(s1[0]-s0[0])-(d1[0]-d0[0])*(s2[0]-s0[0]))/det;
    const b=((d1[1]-d0[1])*(s2[1]-s0[1])-(d2[1]-d0[1])*(s1[1]-s0[1]))/det;
    const dd=((d2[1]-d0[1])*(s1[0]-s0[0])-(d1[1]-d0[1])*(s2[0]-s0[0]))/det;
    const e=d0[0]-a*s0[0]-cc*s0[1],f=d0[1]-b*s0[0]-dd*s0[1];
    x.save();x.beginPath();x.moveTo(e0[0],e0[1]);x.lineTo(e1[0],e1[1]);x.lineTo(e2[0],e2[1]);x.closePath();x.clip();
    x.transform(a,b,cc,dd,e,f);x.drawImage(img,0,0);x.restore();
  }
  function swap(P){
    const t=tris,s=src.p;
    for(let i=0;i<t.length;i+=3){const a=t[i],b=t[i+1],d=t[i+2];tri(src.img,[s[a],s[b],s[d]],[P[a],P[b],P[d]])}
  }
  function drawEmoji(P){
    let l=P[234],r=P[454];if(r[0]<l[0])[l,r]=[r,l];
    const cx=(P[10][0]+P[152][0])/2,cy=(P[10][1]+P[152][1])/2;
    const size=Math.hypot(r[0]-l[0],r[1]-l[1])*1.6;
    x.save();x.translate(cx,cy);x.rotate(Math.atan2(r[1]-l[1],r[0]-l[0]));
    x.font=`${size}px serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(emoji,0,size*.05);x.restore();
  }

  (function loop(){
    x.save();x.scale(-1,1);x.drawImage(v,-c.width,0,c.width,c.height);x.restore();
    if(v.currentTime!==last){last=v.currentTime;res=lmV.detectForVideo(v,performance.now())}
    const L=res&&res.faceLandmarks&&res.faceLandmarks[0];
    if(L&&mode!=='off'){
      const P=L.map(q=>[(1-q.x)*c.width,q.y*c.height]);
      if(mode==='swap'&&src)swap(P);else if(mode==='emoji'&&emoji)drawEmoji(P);
    }
    requestAnimationFrame(loop);
  })();
}catch(err){
  $('st').textContent='Error: '+err.message+' (open via http://localhost, allow camera, check internet)';
}
</script>
</body></html>
